name: Build Jungdong Rust Worker
on:
  push:
    branches:
      - jungdong-rust-build-20261113
  workflow_dispatch:
jobs:
  wasm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Download public room data (67 rooms)
        run: curl --retry 3 -fsSL 'https://jungdong-campus-map.agfvrd.workers.dev/data.json' -o data.json
      - name: Install Rust Worker build helper
        run: cargo install worker-build --locked
      - name: Build actual WASM
        run: worker-build --release
      - name: Upload Rust WASM build
        uses: actions/upload-artifact@v4
        with:
          name: jungdong-rust-worker
          path: build/
          include-hidden-files: true
          if-no-files-found: error
      - name: Export Rust worker modules for Cloudflare deployment
        run: |
          echo "Generated build files:"
          find build -maxdepth 3 -type f | sort
          mkdir -p wasm-export
          cp build/index.js wasm-export/index.js
          WASM="$(find build -type f -name '*.wasm' | head -n 1)"
          test -n "$WASM"
          basename "$WASM" > wasm-export/wasm-name.txt
          base64 -w 0 "$WASM" | fold -w 4000 > wasm-export/module.wasm.b64
          echo "WASM bytes: $(wc -c < "$WASM")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wasm-export/
          git commit -m "build: store reproducible Rust worker modules [skip ci]"
          git push
